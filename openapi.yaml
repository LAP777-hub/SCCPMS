          type: string
          format: uuid
        email:
          type: string
          format: email
        full_name:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
          pattern: '^\+[1-9]\d{7,14}$'
        user_type:
          type: string
          nullable: true
        student_number:
          type: string
          nullable: true
        staff_number:
          type: string
          nullable: true
        department:
          type: string
          nullable: true
        program:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    PatientCreateRequest:
      type: object
      required:
        - email
        - fullName
        - phone
