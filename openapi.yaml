components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token from Supabase Auth

  schemas:
    HealthCheckResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        timestamp:
          type: string
          format: date-time
        dependency:
          type: string
          description: Present when status is unavailable

    MetricsResponse:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, unhealthy]
        timestamp:
          type: string
          format: date-time
        uptime:
          type: string
          description: Server uptime in human-readable format
        database:
          type: object
          properties:
            connected:
              type: boolean
            current_time:
              type: string
              format: date-time
        environment:
          type: string
          enum: [development, test, production]

    MessageResponse:
      type: object
      properties:
        message:
          type: string

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        details:
          type: object
          description: Additional error details (optional)

    OtpVerifyRequest:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          pattern: '^\d{6}$'
          description: 6-digit OTP code

    ProfileResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Profile'

    Profile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        full_name:
          type: string
          nullable: true
        role:
          type: string
          enum: [admin, doctor, patient, receptionist, student, lecturer, staff]
        phone:
          type: string
          nullable: true
          pattern: '^\+[1-9]\d{7,14}$'
        user_type:
          type: string
          nullable: true
        student_number:
          type: string
          nullable: true
        staff_number:
          type: string
          nullable: true
        department:
          type: string
          nullable: true
        program:
          type: string
          nullable: true

    ProfileUpdateRequest:
      type: object
      properties:
        full_name:
          type: string
          minLength: 2
          maxLength: 160
          nullable: true
        address_line1:
          type: string
          maxLength: 200
          nullable: true
        address_line2:
          type: string
          maxLength: 200
          nullable: true
        city:
          type: string
          maxLength: 120
          nullable: true
        province:
          type: string
          maxLength: 120
          nullable: true
        postal_code:
          type: string
          maxLength: 20
          nullable: true

    PatientsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Patient'

    Patient:
      type: object
      properties:
