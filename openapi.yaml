openapi: 3.0.3
info:
  title: SCCPMS API
  description: Smart Campus Clinic Patient Management System API
  version: 1.0.0
  contact:
    name: SCCPMS Support
    email: support@sccpms.edu
  license:
    name: Proprietary

servers:
  - url: http://localhost:4000
    description: Development server
  - url: https://api.your-domain.com
    description: Production server

tags:
  - name: Health
    description: Health check and monitoring endpoints
  - name: Authentication
    description: OTP verification endpoints
  - name: Profile
    description: User profile management
  - name: Patients
    description: Patient management (admin/receptionist)
  - name: Doctors
    description: Doctor management
  - name: Appointments
    description: Appointment scheduling and management
  - name: Scheduling
    description: Availability and clinic settings
  - name: Clinical
    description: Clinical workflows (visits, prescriptions, labs)
  - name: Walk-ins
    description: Walk-in patient management
  - name: Leave
    description: Doctor leave requests
  - name: Notifications
    description: User notifications
  - name: Audit
    description: Audit logging (admin)
  - name: Reports
    description: Operational reports (admin)

paths:
  /healthz:
    get:
      tags: [Health]
      summary: Health check endpoint
      description: Basic health check for monitoring
      operationId: healthCheck
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckResponse'
        '503':
          description: Service is unhealthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckResponse'

  /metrics:
    get:
      tags: [Health]
      summary: Detailed metrics endpoint
      description: Detailed system health and performance metrics
      operationId: metrics
      responses:
        '200':
          description: Metrics retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsResponse'
        '503':
          description: Service is unhealthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsResponse'

  /auth/otp/send:
    post:
      tags: [Authentication]
      summary: Send OTP verification code
      description: Send OTP code to user's phone for two-factor authentication
      operationId: sendOtp
      security:
        - BearerAuth: []
      responses:
        '200':
          description: OTP sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/otp/verify:
    post:
      tags: [Authentication]
      summary: Verify OTP code
      description: Verify the OTP code sent to the user's phone
      operationId: verifyOtp
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
      responses:
        '200':
          description: OTP verified successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Invalid OTP code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/profile:
    get:
      tags: [Profile]
      summary: Get user profile
      description: Retrieve current user's profile information
      operationId: getProfile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags: [Profile]
      summary: Update user profile
      description: Update current user's profile information
      operationId: updateProfile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdateRequest'
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/patients:
    get:
      tags: [Patients]
      summary: List all patients
      description: Retrieve list of all patients (admin/receptionist only)
      operationId: listPatients
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Patients retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientsResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [Patients]
      summary: Register new patient
      description: Register a new patient account (admin/receptionist only)
      operationId: createPatient
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientCreateRequest'
      responses:
        '201':
          description: Patient created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientResponse'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/doctors:
    get:
      tags: [Doctors]
      summary: List all doctors
      description: Retrieve list of all active doctors
      operationId: listDoctors
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Doctors retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoctorsResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
