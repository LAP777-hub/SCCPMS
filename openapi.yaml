          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/clinic/settings:
    get:
      tags: [Scheduling]
      summary: Get clinic settings
      description: Retrieve clinic configuration settings
      operationId: getClinicSettings
      security:
        - BearerAuth: []
