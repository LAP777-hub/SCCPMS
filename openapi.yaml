          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/appointments:
    get:
      tags: [Appointments]
      summary: List appointments
      description: Retrieve appointments (filtered by user role)
      operationId: listAppointments
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Appointments retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentsResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [Appointments]
