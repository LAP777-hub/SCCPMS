services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to your Supabase PostgreSQL database}
      DATABASE_EVENTS_URL: ${DATABASE_EVENTS_URL:-}
      DATABASE_SSL_MODE: ${DATABASE_SSL_MODE:-verify-full}
      DATABASE_SSL_CA: ${DATABASE_SSL_CA:-}
      SUPABASE_URL: ${SUPABASE_URL:?Set SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?Set SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?Set SUPABASE_SERVICE_ROLE_KEY}
      OTP_HMAC_SECRET: ${OTP_HMAC_SECRET:?Set OTP_HMAC_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY:?Set the full Resend API key}
      # Blank primary sender permits only the complete bound owner-admin route.
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      RESEND_ADMIN_OWNER_EMAIL: ${RESEND_ADMIN_OWNER_EMAIL:-}
      RESEND_ADMIN_OWNER_USER_ID: ${RESEND_ADMIN_OWNER_USER_ID:-}
      # Dedicated Photon service for sustained production autocomplete.
      ADDRESS_PHOTON_URL: ${ADDRESS_PHOTON_URL:-https://photon.komoot.io/api/}
      ADDRESS_SEARCH_INTERVAL_MS: ${ADDRESS_SEARCH_INTERVAL_MS:-1100}
      ADDRESS_SEARCH_DAILY_LIMIT: ${ADDRESS_SEARCH_DAILY_LIMIT:-500}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?Set the public HTTPS frontend origin}
      TRUST_PROXY: 1
    ports:
      - "127.0.0.1:4000:4000"
    restart: unless-stopped
    stop_grace_period: 35s
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:?Set the same Supabase project URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:?Set the public anon key}
        VITE_API_URL: ${VITE_API_URL:?Set the API origin}
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
