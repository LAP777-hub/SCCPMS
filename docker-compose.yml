version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:14-alpine
    container_name: sccpms-postgres
    environment:
      POSTGRES_USER: sccpms_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-$(openssl rand -base64 32)}
      POSTGRES_DB: sccpms
    # Don't expose port 5432 to host - only accessible via Docker network
    # ports:
    #   - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/sql:/docker-entrypoint-initdb.d
    networks:
      - sccpms-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sccpms_user -d sccpms"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: sccpms-backend
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://sccpms_user:sccpms_password@postgres:5432/sccpms
      DATABASE_SSL_MODE: disable
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      OTP_HMAC_SECRET: ${OTP_HMAC_SECRET}
      AFRICASTALKING_USERNAME: ${AFRICASTALKING_USERNAME}
      AFRICASTALKING_API_KEY: ${AFRICASTALKING_API_KEY}
      AFRICASTALKING_SENDER_ID: ${AFRICASTALKING_SENDER_ID}
      FRONTEND_ORIGIN: http://localhost:80
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sccpms-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_API_URL: ${VITE_API_URL}
    container_name: sccpms-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - sccpms-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  sccpms-network:
    driver: bridge