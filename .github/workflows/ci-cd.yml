name: Project checks

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Frontend CI
  frontend-ci:
    runs-on: ubuntu-latest
    env:
      # Browser tests intercept Auth/API traffic and never use production accounts.
      VITE_SUPABASE_URL: https://clinic-ci.supabase.co
      VITE_SUPABASE_ANON_KEY: ci-test-anon-key
      VITE_API_URL: http://localhost:4000
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: package-lock.json
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run linter
      run: npm run lint
    
    - name: Type check
      run: npm run typecheck
    
    - name: Build frontend
      run: npm run build

    - name: Install Chrome and browser dependencies
      run: npx --no-install playwright install --with-deps chrome

    - name: Run browser tests
      run: npm run test:ui
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: frontend-dist
        path: dist/
        retention-days: 7

  # Backend CI
  backend-ci:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
      DATABASE_SSL_MODE: disable
      SUPABASE_URL: https://clinic-ci.supabase.co
      SUPABASE_ANON_KEY: ci-test-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-test-service-role-key
      OTP_HMAC_SECRET: ci-test-secret-key-at-least-32-characters
      RESEND_API_KEY: re_ci_test_key_for_mocked_email_only
      RESEND_FROM_EMAIL: SCCPMS <onboarding@resend.dev>
      FRONTEND_ORIGIN: http://localhost:5173
    
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: server/package-lock.json
    
    - name: Install dependencies
      working-directory: ./server
      run: npm ci
    
    - name: Type check
      working-directory: ./server
      run: npm run typecheck
    
    - name: Run tests
      working-directory: ./server
      run: npm test

    - name: Prepare ephemeral database policy roles
      run: >-
        docker exec ${{ job.services.postgres.id }}
        psql -U test_user -d test_db -v ON_ERROR_STOP=1
        -c "CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN;"

    - name: Run isolated database workflows
      working-directory: ./server
      run: npm run test:database
    
    - name: Build backend
      working-directory: ./server
      run: npm run build
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: backend-dist
        path: server/dist/
        retention-days: 7

  # Security Scanning
  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check published files for secrets and private archives
      run: node scripts/check-publish-secrets.mjs --tracked
    
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
    
    - name: Upload Trivy results to GitHub Security
      if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: 'trivy-results.sarif'

  # Vercel builds and deploys each project directly from the connected GitHub repository.
